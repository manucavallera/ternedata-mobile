server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Evita que el proxy entregue el bundle Expo en respuestas parciales
    # (HTTP 206); algunos clientes quedan esperando el resto del JavaScript.
    max_ranges 0;

    location / {
        # Expo Web is a single-page application. Deep links, such as email
        # verification, must load the app instead of returning nginx's 404.
        try_files $uri $uri/ /index.html;
    }
}
